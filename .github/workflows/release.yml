# Builds the installers, for a tag and for every commit on main.
#
# Two outcomes from one workflow, because the builds themselves are identical:
#
#   A tag  ->  a draft release carrying that version. Draft, because nothing here is signed and
#              both platforms greet the first launch with a warning, so whoever tags a version
#              should get to write that into the notes before anybody downloads it.
#
#   main   ->  one rolling pre-release under the fixed tag `nightly`, replaced on every push. A
#              release per commit would bury the real versions under a hundred entries nobody
#              can tell apart within a fortnight, and what people actually want from main is
#              "the current build", which is exactly one file per platform.
#
#              The tag is called `nightly` and not `main` because a tag and a branch of the
#              same name make every bare `main` ambiguous. `git push origin main` stops with
#              "src refspec main matches more than one" and refuses to do anything at all,
#              which is the workflow CONTRIBUTING.md asks people to follow.
#
# No macOS. Gatekeeper refuses to start an unsigned application outright rather than asking,
# which makes a macOS build something almost nobody could open. That needs an Apple developer
# account and a signing identity, and until those exist a macOS artifact would be a download
# that does not work.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  # Also runnable by hand, so a build can be checked without spending a tag on it.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failing should not hide whether the other one built.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifacts: dist/*.exe
            sums: '*.exe'
          - os: ubuntu-latest
            script: dist:linux
            # Two files per build, and the wildcards keep the versioned names intact.
            artifacts: |
              dist/*.AppImage
              dist/*.deb
            sums: '*.AppImage *.deb'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # See the note in ci.yml: the lockfile needs npm 11 to be read as written.
      - run: npm install -g npm@11

      - run: npm ci

      # The gate in front of anything that gets published, and since CI no longer runs on a
      # push to main, the only one there. Both platforms rather than only Windows: this is
      # where the Linux side of the suite is exercised at all.
      - run: npm run typecheck
      - run: npm test

      # `--publish never` rather than an empty token: electron-builder starts publishing on its
      # own the moment it sees a git tag, and says so in a warning. The upload happens once,
      # below, against the draft the release job creates.
      - run: npm run ${{ matrix.script }} -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: peregrine-${{ runner.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

      # Each job vouches for the files it built, as it built them. The checksums are computed
      # here, next to the build, and the release job only collects them. That keeps them honest
      # about what was produced rather than about what happened to be downloaded later, and a
      # further platform needs nothing but a job that uploads a `checksums-*` artifact of its own.
      # Bash on both runners: the Windows default would be PowerShell, which has no `sha256sum`.
      - name: Checksums
        shell: bash
        working-directory: dist
        run: |
          mkdir -p ../checksums
          sha256sum ${{ matrix.sums }} > ../checksums/${{ runner.os }}.txt
          cat ../checksums/${{ runner.os }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ runner.os }}
          path: checksums/${{ runner.os }}.txt
          if-no-files-found: error

  release:
    needs: build
    # A manual run leaves the artifacts on the build jobs and publishes nothing: that is the
    # point of being able to start it by hand.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      # Two downloads rather than one, so the checksum files do not end up attached as if they
      # were installers.
      - uses: actions/download-artifact@v4
        with:
          pattern: peregrine-*
          path: artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: checksums-*
          path: checksums
          merge-multiple: true

      # Nothing here is signed, so a checksum is the only way for somebody to tell that what
      # they downloaded is what was built. They go into the text of the release, where they can
      # be read without downloading anything, and also as one file that `sha256sum -c` accepts.
      - name: Write the notes
        run: |
          cat checksums/*.txt > artifacts/SHA256SUMS.txt
          {
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              cat <<'TEXT'
          ### Windows
          `Peregrine-<version>-Setup.exe`. The installer is not signed, so SmartScreen warns
          on first launch: choose "More info" and then "Run anyway".

          ### Linux
          `.AppImage` runs without being installed once it is marked executable
          (`chmod +x`). The `.deb` is for Debian and Ubuntu, install it with
          `sudo apt install ./Peregrine-<version>-amd64.deb`.
          TEXT
            else
              cat <<TEXT
          The current state of \`main\`, rebuilt on every commit and replaced each time. This
          is not a release: it is whatever was merged last, useful for trying a fix before it
          is tagged and no basis for anything else.

          Built from $GITHUB_SHA. Unsigned, like the tagged builds.
          TEXT
            fi
            echo
            echo '### SHA-256'
            for file in checksums/*.txt; do
              echo
              echo "**$(basename "$file" .txt)**"
              echo '```'
              cat "$file"
              echo '```'
            done
            echo
            echo 'Verify with `sha256sum -c SHA256SUMS.txt` on Linux, or `Get-FileHash <file>`'
            echo 'in PowerShell and compare by eye.'
          } > notes.md
          cat notes.md

      # A tag: the real thing, kept as a draft until somebody writes the notes.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: artifacts/*
          body_path: notes.md

      # Torn down before it is written again, because uploading only replaces an asset whose
      # name matches. Installer names carry the version, so the first build after a version
      # bump would leave the old files sitting beside the new ones under one entry, with a
      # checksum file describing only half of them. Deleting the release leaves the tag alone,
      # and the step below recreates the entry.
      - name: Clear the previous development build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete nightly --yes --repo "$GITHUB_REPOSITORY" || true

      # A commit on main: one rolling pre-release, replaced each time. `tag_name` is fixed and
      # the tag is moved to the commit that was built, so the entry always describes what is
      # attached to it.
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: Development build
          prerelease: true
          files: artifacts/*
          body_path: notes.md
