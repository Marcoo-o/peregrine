# A throwaway Dovecot for developing and testing the IMAP client. Not a service: it is started by
# hand from /tmp/peregrine-dovecot and holds no real mail.
base_dir = /tmp/peregrine-dovecot/run
log_path = /tmp/peregrine-dovecot/dovecot.log
info_log_path = /tmp/peregrine-dovecot/dovecot.log
protocols = imap
listen = *
login_trusted_networks = 0.0.0.0/0
mail_location = maildir:~/Maildir
mail_home = /tmp/peregrine-dovecot/home/%u
first_valid_uid = 1
ssl = yes
ssl_cert = </tmp/peregrine-dovecot/cert.pem
ssl_key = </tmp/peregrine-dovecot/key.pem
disable_plaintext_auth = yes
auth_mechanisms = plain login
mail_plugins =

service imap-login {
  inet_listener imap {
    port = 1143
  }
  inet_listener imaps {
    port = 1993
    ssl = yes
  }
}

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /tmp/peregrine-dovecot/users
}

userdb {
  driver = static
  args = uid=vmail gid=vmail home=/tmp/peregrine-dovecot/home/%u
}

namespace inbox {
  inbox = yes
  separator = .
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = create
  }
}
