apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The packages are installed in the node_modules at the root of the repository, because this
    //   folder is an npm workspace, so the three paths below point there and not next to this project.
    reactNativeDir = file("../../../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    codegenDir = file("../../../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    cliFile = file("../../../../node_modules/react-native/cli.js")
    //   The Hermes compiler comes as the hermes-compiler package, which is hoisted like the rest.
    //   %OS-BIN% becomes win64-bin, linux64-bin or osx-bin.
    hermesCommand = file("../../../../node_modules/hermes-compiler/hermesc/%OS-BIN%/hermesc").absolutePath

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]
    //   A debug build loads its JavaScript from Metro on a developer's machine, so an APK built
    //   without Metro does not start. CI has no Metro, and an APK that needs one is of no use to
    //   anybody who downloads it. -PbundleJs makes the debug build carry its JavaScript.
    debuggableVariants = project.hasProperty("bundleJs") ? [] : ["debug", "debugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The key a release build is signed with: the user's own, which is never in the repository. Where it is kept is given in `~/.gradle/gradle.properties` (or with
 * `-P` on the command line, or as environment variables `PEREGRINE_RELEASE_STORE_FILE` and so on):
 *
 *   peregrineReleaseStoreFile=/home/me/.peregrine/release.keystore
 *   peregrineReleaseStorePassword=...
 *   peregrineReleaseKeyAlias=peregrine
 *   peregrineReleaseKeyPassword=...
 *
 * `scripts/release/make-keystore.sh` makes the keystore. Without one a release build still builds, signed with the debug key so that it can be tried, and says so
 * loudly; `-PperegrineRequireReleaseKey=true` (which `scripts/release/build-apk.sh` passes) makes that an error instead, so that a build that is to be given to
 * somebody can never be signed with the debug key by mistake.
 */
def releaseSetting = { String name ->
    def env = System.getenv('PEREGRINE_RELEASE_' + name.replaceAll(/([A-Z])/, '_$1').toUpperCase().replaceFirst('^_', ''))
    return project.findProperty('peregrineRelease' + name) ?: env
}
def releaseStoreFile = releaseSetting('StoreFile')
def hasReleaseKey = releaseStoreFile != null && file(releaseStoreFile).exists() && releaseSetting('StorePassword') != null && releaseSetting('KeyAlias') != null
if (project.findProperty('peregrineRequireReleaseKey') == 'true' && !hasReleaseKey) {
    throw new GradleException('No release key is set up (peregrineReleaseStoreFile, StorePassword, KeyAlias, KeyPassword): see scripts/release/make-keystore.sh')
}
gradle.taskGraph.whenReady { graph ->
    if (!hasReleaseKey && graph.allTasks.any { it.name in ['assembleRelease', 'bundleRelease', 'packageRelease'] }) {
        logger.warn('WARNING: this release build is signed with the DEBUG key (no release key is set up). Do not give it to anybody: it cannot be updated by a properly signed build.')
    }
}

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.peregrinemobile"
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        // The package of the push service of the system, where a system has one that speaks the protocol of `SystemPush.kt` (see docs/mobile.md, "The push
        // provider of a system"): its permissions, its actions and its receiver are named after it. A build for a system whose service has another package says
        // so with `-PperegrinePushProvider=<package>` (or in `~/.gradle/gradle.properties`); without a service of that name nothing is sent and the application
        // looks for mail as it does anywhere else.
        def pushProvider = project.findProperty('peregrinePushProvider') ?: 'app.peregrine.push'
        manifestPlaceholders = [pushProvider: pushProvider]
        buildConfigField "String", "PUSH_PROVIDER", "\"${pushProvider}\""

        applicationId "com.peregrinemobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // The version a release is given: `-PperegrineVersionName=1.2.0` and `-PperegrineVersionCode=12` (the code only ever goes up: it is what the system compares
        // to decide whether a build is an update). `scripts/release/build-apk.sh` sets both.
        versionCode((project.findProperty('peregrineVersionCode') ?: '1').toString().toInteger())
        versionName(project.findProperty('peregrineVersionName') ?: '1.0')
    }
    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseSetting('StorePassword')
                keyAlias releaseSetting('KeyAlias')
                keyPassword releaseSetting('KeyPassword') ?: releaseSetting('StorePassword')
            }
        }
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // `-PdevSuffix=.dev` gives the debug build another application id, so that it can be installed next to another build.
            if (project.hasProperty('devSuffix')) applicationIdSuffix project.property('devSuffix')
        }
        release {
            // The user's own key where there is one, the debug key (and a warning, see above) where there is not.
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // The scheduler for looking for new mail while the application is closed. It keeps the work across a
    // restart of the phone and runs it when there is a network.
    implementation("androidx.work:work-runtime:2.10.0")

    // The JVM tests, which run without a phone: the certificate check in TlsUpgrade.
    testImplementation("junit:junit:4.13.2")
    // The platform's org.json is a stub in the JVM tests, which read and write the file of the sources.
    testImplementation("org.json:json:20240303")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
